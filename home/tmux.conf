# ~/.tmux.conf — tmux 3.6
#
# Layout:
#   1. Terminal & capabilities    4. Copy mode & clipboard
#   2. General behaviour          5. Theme (Catppuccin Mocha)
#   3. Key bindings               6. Optional plugins (TPM)
#
# Reload after editing:  prefix + r   (or: tmux source-file ~/.tmux.conf)

# ─────────────────────────────────────────────────────────────────────────────
# 1. Terminal & capabilities
# ─────────────────────────────────────────────────────────────────────────────

# Advertise a terminfo entry that describes tmux itself (italics, 256 colours).
set -g  default-terminal "tmux-256color"

# Declare capabilities the outer terminal has but terminfo does not report.
# terminal-features is preferred over terminal-overrides for whole feature
# classes. Keep this list to things the terminal genuinely supports.
set -as terminal-features ",xterm*:RGB:hyperlinks:ccolour:cstyle:usstyle:strikethrough:overline:sync:title:clipboard:focus:extkeys"
set -as terminal-features ",*256col*:RGB"
set -as terminal-features ",alacritty*:RGB:hyperlinks:usstyle:sync"
set -as terminal-features ",ghostty*:RGB:hyperlinks:usstyle:sync:osc7"
set -as terminal-features ",wezterm*:RGB:hyperlinks:usstyle:sync"

# CSI u key encoding: lets Ctrl-Shift-<key>, Ctrl-Enter etc. reach the app
# (notably Neovim) instead of being flattened by the legacy xterm encoding.
set -s  extended-keys on
set -as terminal-features ",*:extkeys"

# Let applications emit escape sequences tmux does not understand (image
# protocols, OSC 52 from nested sessions, some Neovim plugins).
set -g  allow-passthrough on

# ─────────────────────────────────────────────────────────────────────────────
# 2. General behaviour
# ─────────────────────────────────────────────────────────────────────────────

# Escape is a prefix for real key sequences; a long wait makes vi-mode feel
# sluggish. 10ms is responsive without misreading genuine escape sequences
# on slow links (0 is fine locally but can corrupt input over bad SSH).
set -s  escape-time 10

set -g  history-limit 50000      # scrollback per pane
set -g  display-time 3000        # status messages stay readable
set -g  display-panes-time 2000  # pane numbers (prefix + q)
set -g  status-interval 5        # status refresh; 1s is wasteful on a laptop

# Number windows/panes from 1 — matches the keyboard, and 0 is a long reach.
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on      # close window 2 of 1,2,3 -> 1,2 (no gaps)

set -g  mouse on                 # select panes/windows, resize, scroll
set -g  focus-events on          # forward focus to apps (vim autoread, etc.)
set -g  set-titles on
set -g  set-titles-string "#{session_name}  #{window_index}:#{window_name}"

setw -g automatic-rename on      # name windows after the running command
set -g  allow-rename off         # ...but ignore programs that rename via OSC

# Resize a window to the smallest client only when that client is actually
# looking at it, not merely attached to the session.
setw -g aggressive-resize on

# Attaching to a dead session's server should move you on, not drop you out.
set -g  detach-on-destroy off

# Bells: notify on a real bell, stay quiet about mere output.
set -g  visual-bell off
set -g  visual-activity off
setw -g monitor-bell on
setw -g monitor-activity off

# Treat these as word boundaries when double-clicking / using vi word motions,
# so paths and flags select as a unit.
set -g  word-separators " @\"=()[]{}',;:"

# Renumber-safe, predictable window ordering when using choose-tree.
set -g  mode-keys vi
set -g  status-keys emacs        # command prompt uses readline keys

# ─────────────────────────────────────────────────────────────────────────────
# 3. Key bindings
# ─────────────────────────────────────────────────────────────────────────────

# Prefix: C-a is reachable without contorting the left hand. C-b stays usable
# for nothing else, so nothing is lost. To revert, delete the next three lines.
# Press prefix twice to send a literal C-a through to the shell/readline.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "  ~/.tmux.conf reloaded"

# Splits keep the current working directory. Mnemonic: | is vertical, - is
# horizontal. The default % and " bindings are left intact.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Full-width / full-height splits.
bind \\ split-window -fh -c "#{pane_current_path}"
bind _  split-window -fv -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize: hold the direction key after the prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Repeatable window switching; prefix + Tab for last window.
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Move the current window left/right in the window list.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Panes: zoom, break out, join in, even them out.
bind Space next-layout
bind e select-layout -E                   # spread panes evenly
bind b break-pane -d                      # send pane to its own window
bind @ choose-window "join-pane -h -s '%%'"

# Sessions.
bind C-j choose-tree -Zs                  # fuzzy-ish session/window picker
bind S command-prompt -p "new session:" "new-session -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Scratch shell in a popup, in the current directory (tmux >= 3.2).
bind g display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Toggle the mouse when you need the terminal's own selection instead.
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# Toggle pane synchronisation (type once, run everywhere). Bound to C-s rather
# than s so the default s (choose-session) survives; likewise q (display-panes)
# and x (kill-pane, with its confirmation) are deliberately left alone.
bind C-s setw synchronize-panes \; display-message "sync-panes: #{?pane_synchronized,on,off}"

# ─────────────────────────────────────────────────────────────────────────────
# 4. Copy mode & clipboard
# ─────────────────────────────────────────────────────────────────────────────

# OSC 52: lets tmux set the system clipboard through the terminal itself,
# which is what makes copying work over SSH.
set -s set-clipboard on

# Pick a local clipboard backend once, at config load. Later matches win, so
# the order below is "least preferred first": clip.exe -> xclip -> wl-copy.
set -g @clipboard 'tmux load-buffer -'
if-shell 'command -v clip.exe >/dev/null 2>&1' 'set -g @clipboard "clip.exe"'
if-shell 'command -v xclip   >/dev/null 2>&1' 'set -g @clipboard "xclip -selection clipboard -in"'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -g @clipboard "wl-copy --trim-newline"'

bind Enter copy-mode
bind P paste-buffer -p
bind C-p choose-buffer -Z

# vi-style selection.
bind -T copy-mode-vi v     send-keys -X begin-selection
bind -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind -T copy-mode-vi H     send-keys -X start-of-line
bind -T copy-mode-vi L     send-keys -X end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel

# y / Enter copy to the system clipboard and leave copy mode.
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "#{@clipboard}"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@clipboard}"

# Mouse drag copies but keeps the scroll position — do not jump to the prompt.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "#{@clipboard}"
bind -T copy-mode-vi DoubleClick1Pane \
    send-keys -X select-word \; send-keys -X copy-pipe "#{@clipboard}"

# Middle-click pastes the tmux buffer.
bind -n MouseDown2Pane paste-buffer -p

# ─────────────────────────────────────────────────────────────────────────────
# 5. Theme — Catppuccin Mocha, no plugins, no Nerd Font required
#
# Segment edges use the Unicode half-block characters U+2590 and U+258C, which
# are present in ordinary monospace fonts; swap them for  /  if you have a
# patched Nerd Font and want true Powerline wedges.
# ─────────────────────────────────────────────────────────────────────────────

# Palette
set -g @crust    "#11111b"
set -g @mantle   "#181825"
set -g @base     "#1e1e2e"
set -g @surface0 "#313244"
set -g @surface1 "#45475a"
set -g @overlay0 "#6c7086"
set -g @overlay1 "#7f849c"
set -g @subtext0 "#a6adc8"
set -g @text     "#cdd6f4"
set -g @blue     "#89b4fa"
set -g @lavender "#b4befe"
set -g @mauve    "#cba6f7"
set -g @green    "#a6e3a1"
set -g @yellow   "#f9e2af"
set -g @peach    "#fab387"
set -g @red      "#f38ba8"
set -g @teal     "#94e2d5"

# Panes
setw -gF pane-border-style        "fg=#{@surface0}"
setw -gF pane-active-border-style "fg=#{@blue}"
set  -g  pane-border-lines heavy
set  -g  pane-border-indicators both
setw -gF window-style             "bg=#{@base}"
setw -gF window-active-style      "bg=#{@base}"

# Copy mode / selection
setw -gF mode-style "fg=#{@crust},bg=#{@lavender},bold"
setw -gF copy-mode-match-style         "fg=#{@crust},bg=#{@yellow}"
setw -gF copy-mode-current-match-style "fg=#{@crust},bg=#{@peach},bold"
setw -gF copy-mode-mark-style          "fg=#{@crust},bg=#{@teal}"

# Messages & command prompt
set -gF message-style         "fg=#{@crust},bg=#{@peach},bold"
set -gF message-command-style "fg=#{@text},bg=#{@surface0}"

# Popups & menus
set -g  popup-border-lines rounded
set -gF popup-style         "fg=#{@text},bg=#{@mantle}"
set -gF popup-border-style  "fg=#{@blue},bg=#{@mantle}"
set -g  menu-border-lines rounded
set -gF menu-style          "fg=#{@text},bg=#{@mantle}"
set -gF menu-selected-style "fg=#{@crust},bg=#{@blue},bold"
set -gF menu-border-style   "fg=#{@blue},bg=#{@mantle}"

set -gF clock-mode-colour "#{@blue}"
set -g  clock-mode-style 24

# Status bar
set -g  status on
set -g  status-position top
set -g  status-justify left
set -gF status-style "fg=#{@subtext0},bg=#{@mantle}"
# The four format options below use plain `set`, not `set -F`: -F expands the
# value once, here, which would bake #S/#I/#W and the conditionals down to
# empty strings. #{@palette} entries resolve at render time just the same.
set -g  status-left-length 80
set -g  status-right-length 120

# Left: session pill. Turns mauve while the prefix is held, so you always know
# whether tmux is listening.
set -g  status-left "\
#[fg=#{?client_prefix,#{@mauve},#{@blue}},bg=#{@mantle}]▐\
#[fg=#{@crust},bg=#{?client_prefix,#{@mauve},#{@blue}},bold] #S \
#[fg=#{?client_prefix,#{@mauve},#{@blue}},bg=#{@mantle},nobold]▌ "

# Right: zoom/sync/bell flags, working directory, then the clock pill.
set -g  status-right "\
#{?pane_synchronized,#[fg=#{@red}]  SYNC ,}\
#{?window_zoomed_flag,#[fg=#{@yellow}]  ZOOM ,}\
#[fg=#{@overlay0},bg=#{@mantle}] #{b:pane_current_path} \
#[fg=#{@surface1},bg=#{@mantle}]│\
#[fg=#{@overlay1},bg=#{@mantle}] #{=|20|…:host_short} \
#[fg=#{@lavender},bg=#{@mantle}]▐\
#[fg=#{@crust},bg=#{@lavender},bold] %H:%M \
#[fg=#{@lavender},bg=#{@mantle},nobold]▌"

# Windows
set -g  window-status-separator ""
setw -g  window-status-format "\
#[fg=#{@mantle},bg=#{@mantle}] \
#[fg=#{@overlay1},bg=#{@mantle}]#I#[fg=#{@surface1}]·#[fg=#{@subtext0}]#W\
#{?window_last_flag,#[fg=#{@overlay0}]⁻,}\
#{?window_bell_flag,#[fg=#{@red}] ●,}\
#[fg=#{@mantle},bg=#{@mantle}] "
setw -g  window-status-current-format "\
#[fg=#{@teal},bg=#{@mantle}]▐\
#[fg=#{@crust},bg=#{@teal},bold] #I#[nobold]·#[bold]#W \
#[fg=#{@teal},bg=#{@mantle},nobold]▌"
setw -gF window-status-bell-style "fg=#{@red},bg=#{@mantle},bold"

# ─────────────────────────────────────────────────────────────────────────────
# 6. Optional plugins (TPM) — everything above works without them.
#
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   uncomment the block, reload, then press prefix + I to install.
# ─────────────────────────────────────────────────────────────────────────────
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + C-s / C-r
# set -g @plugin 'tmux-plugins/tmux-continuum'   # periodic auto-save
# set -g @continuum-restore 'on'
# run '~/.tmux/plugins/tpm/tpm'
